name: Build Android 16 APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: Extract Source Code
        run: |
          mkdir -p app/src/main/java/com/custom/smartwallpaper/service
          mkdir -p app/src/main/java/com/custom/smartwallpaper/ui
          mkdir -p app/src/main/java/com/custom/smartwallpaper/receiver
          echo "Building architecture from Source..."
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build Debug APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Skipping compilation on blank workspace"
          fi
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartWallpaper-v1-APK
          path: app/build/outputs/apk/debug/*.apk
